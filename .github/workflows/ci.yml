
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Download modules
        run: go mod download

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.14.0
          args: ./...

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: palge
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d palge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.26.3"
          cache-dependency-path: go.sum

      - name: Install golang-migrate CLI
        run: |
          curl -fsSL https://packagecloud.io/golang-migrate/migrate/gpgkey | sudo gpg --dearmor -o /etc/apt/keyrings/migrate.gpg
          echo "deb [signed-by=/etc/apt/keyrings/migrate.gpg] https://packagecloud.io/golang-migrate/migrate/ubuntu/ $(lsb_release -sc) main" > /etc/apt/sources.list.d/migrate.list
          apt-get update
          apt-get install -y migrate

      - name: Build
        env:
          DB_DSN: ${{ vars.DB_DSN }}
        run: go build -v ./...

      - name: Create Test Database
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -p 5433 -U postgres -c "CREATE DATABASE palge_test;"

      - name: Run Migrations
        run: |
          migrate -path=./migrations -database="postgres://postgres:postgres@127.0.0.1:5433/palge_test?sslmode=disable" up


      - name: Test
        env:
          TEST_DB_DSN: postgres://postgres:postgres@127.0.0.1:5433/palge_test?sslmode=disable
        run: go test -v ./...
